name: release
on:
  workflow_call:
    inputs:
      flutter-version:
        type: string
        required: false
        default: '3.32.4'
      repo-path:
        required: false
        default: '.'
        type: string
      melos-version:
        description: "Melos version used by bluefireteam/melos-action. Must be >= 8.6.0 so versioning detects plain root-package `vX.Y.Z` tags."
        type: string
        required: false
        default: '8.7.0'

jobs:
  dart-scan:
    uses: affinidi/pipeline-security/.github/workflows/dart-scanner.yml@main
    with:
      repo-path: ${{ inputs.repo-path }}
      flutter-version: ${{ inputs.flutter-version }}
    secrets: inherit
  build:
    needs: [dart-scan]
    runs-on: ubuntu-latest
    environment: main
    concurrency: release
    if: ${{ !contains(github.event.head_commit.message, 'chore(release)') }}
    steps:
      - name: Generate token from app token #https://github.com/tibdex/github-app-token
        id: generate_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PKEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
      # Set git identity to the GitHub App bot user so commits are marked
      # "Verified" by GitHub without requiring a local signing key.
      # GitHub matches the bot's noreply email to the push token and signs server-side.
      # See: https://github.com/actions/create-github-app-token#configure-git-cli-for-an-apps-bot-user
      - name: Get GitHub App bot user ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.generate_token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
      - name: configure git
        run: |
          git config user.name "${{ steps.generate_token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.get-user-id.outputs.user-id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com"
      # Note: This workflow uses the latest stable version of the Flutter+Dart SDK.
      # You can specify other versions if desired, see documentation here:
      # https://github.com/flutter-actions/setup-flutter/blob/main/README.md
      - uses: flutter-actions/setup-flutter@0e3ac53a5126c46be01612423cf26b5d59018adc # v5.0
        with:
          channel: stable
          version: ${{ inputs.flutter-version }}
      - uses: bluefireteam/melos-action@v3
        with:
          melos-version: ${{ inputs.melos-version }}
          run-versioning: true
          publish-dry-run: true
          tag: true
          create-pr: false
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
