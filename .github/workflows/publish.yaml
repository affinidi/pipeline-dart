name: publish


on:
  workflow_call:
    inputs:
      publish: 
        required: false
        type: boolean
        default: false
      flutter-version:
        type: string
        required: false
        default: '3.32.4'

jobs:
  publish-packages:
    name: Publish packages
    environment: release
    permissions:
      contents: write
      id-token: write # Required for authentication using OIDC
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: flutter-actions/setup-flutter@v3
        with:
          channel: stable
          version: ${{ inputs.flutter-version }}
      - uses: flutter-actions/setup-pubdev-credentials@v1
      - uses: bluefireteam/melos-action@v3
        with:
          # Pin Melos >= 8.6.0 so plain root-package `vX.Y.Z` tags map to the package.
          melos-version: '8.7.0'
          publish: ${{ inputs.publish }}
          dart-version: 'none'