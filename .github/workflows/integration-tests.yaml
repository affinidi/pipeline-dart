name: integration_test
on:
  workflow_call:
    inputs:
      flutter-version:
        type: string
        required: false
        default: '3.32.4'
      working-directory:
        type: string
        required: true
        default: './packages/integration_tests'
      melos-version:
        description: "Melos version used by bluefireteam/melos-action. Empty means the latest release."
        type: string
        required: false
        default: ''

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@0e3ac53a5126c46be01612423cf26b5d59018adc # v5.0
        with:
          channel: stable
          version: ${{ inputs.flutter-version }}

      - if: ${{ steps.testing-env-cache.outputs.cache-hit != 'true' }}
        name: Prepare environment file
        env:
          TESTING_ENV_FILE_CONTENT: ${{ secrets.TESTING_ENV_FILE_CONTENT }}
          WORKDIR: ${{ inputs.working-directory }}
        run: echo $TESTING_ENV_FILE_CONTENT | base64 --decode > "$WORKDIR/.env"

      - name: Set up melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: ${{ inputs.melos-version }}

      - name: Run integration tests
        run: melos test-integration
